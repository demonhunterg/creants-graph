plugins {
    id 'org.springframework.boot' version '2.5.6'
    id 'io.spring.dependency-management' version '1.0.11.RELEASE'
    id 'java'
    id 'eclipse'
}

group = 'com.creants'
version = ''
sourceCompatibility = '1.8'

repositories {
    mavenCentral()
    flatDir {
        dirs 'lib'
    }
}

configurations {
    all {
        exclude module: 'spring-boot-starter-logging'
        resolutionStrategy.eachDependency { DependencyResolveDetails details ->
            if (details.requested.group == 'org.apache.logging.log4j') {
                details.useVersion '2.15.0'
            }
        }
    }

    compileOnly {
        extendsFrom annotationProcessor
    }

}

dependencies {
    implementation 'commons-lang:commons-lang:2.6'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-mail'
    implementation 'org.springframework.boot:spring-boot-starter-log4j2'
    implementation 'org.springframework.boot:spring-boot-starter-data-mongodb'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-security'
   
    implementation 'com.google.api-client:google-api-client:1.25.0'
    implementation 'io.springfox:springfox-swagger2:2.9.2'
  	implementation 'io.springfox:springfox-swagger-ui:2.9.2'
   
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'
    implementation 'com.auth0:java-jwt:3.8.1'
    implementation 'com.google.code.gson:gson:2.8.5'
    implementation 'com.restfb:restfb:1.35.0'
    implementation 'com.google.guava:guava:21.0'
    implementation group: 'commons-codec', name: 'commons-codec', version: '1.10'
    implementation group: 'commons-lang', name: 'commons-lang', version: '2.6'
}

test {
    useJUnitPlatform()
}

task copySrc(type: Copy){
    from "src"
	exclude "main/java"
	exclude "test"
    into "$buildDir/libs/src"
}

task copyCmd(type: Copy) {
    from "run.bat"
    into "$buildDir/libs"
}

task copyConfig(type: Copy) {
    from "config"
    into "$buildDir/libs/config"
}

task copyLibs(type: Copy){
	from configurations.runtimeClasspath
    into "$buildDir/libs/lib"
}

task copyRuntimeLibs(type: Copy){
	from configurations.runtimeClasspath
    into "runtime-lib"
}

jar {
    archiveFileName = 'creants-graph-2x.jar'
}


//build đầy đủ
task fatBuild(type: Copy, dependsOn: ["jar", "copySrc", "copyConfig", "copyCmd", "copyLibs"]) {
	description 'Build jar, copy web source, config and run bath file'
}

task fatBuildUpdateLib(type: Copy, dependsOn: ["jar", "copySrc", "copyConfig", "copyCmd", "copyRuntimeLibs", "copyLibs"]) {
	description 'Build jar, copy web source, config and run bath file'
}

//build bản nhẹ chỉ có src
task("litBuild", type: Copy, dependsOn: "copySrc") {
	description 'Copy web source'
    from configurations.runtimeClasspath
    into "$buildDir/libs/lib"
}


